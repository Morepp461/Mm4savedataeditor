name: Android build and test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Unit tests and Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4
      - name: Install Gradle 8.9
        run: |
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip --output "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare private release signing (when secrets exist)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mm4-release-key.jks"
          echo "MM4_KEYSTORE_PATH=$RUNNER_TEMP/mm4-release-key.jks" >> "$GITHUB_ENV"
      - name: Configure signing credentials
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "MM4_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MM4_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MM4_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Run codec unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug and signed release APKs
        run: gradle --no-daemon assembleDebug assembleRelease
      - name: Verify APKs exist
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release.apk
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mm4-save-data-editor-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: mm4-save-data-editor-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
