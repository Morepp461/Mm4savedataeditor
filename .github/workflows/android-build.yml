name: Android build and test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Unit tests and Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4
      - name: Install Gradle 8.9
        run: |
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip --output "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare private release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mm4-release-key.jks"
            test -s "$RUNNER_TEMP/mm4-release-key.jks"
            echo "MM4_KEYSTORE_PATH=$RUNNER_TEMP/mm4-release-key.jks" >> "$GITHUB_ENV"
            echo "MM4_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "MM4_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "MM4_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Diagnose and validate private release keystore
        if: steps.signing.outputs.has_keystore == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          STORE="$RUNNER_TEMP/mm4-release-key.jks"
          echo "Checking decoded keystore file format..."
          file "$STORE"
          echo "Checking keystore password and listing aliases..."
          if ! keytool -list -keystore "$STORE" -storepass "$KEYSTORE_PASSWORD"; then
            echo "::error::Keystore file was decoded, but Java could not open it with the supplied store password. No secret values were printed."
            exit 1
          fi
          echo "Checking configured alias..."
          if ! keytool -list -keystore "$STORE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS"; then
            echo "::error::The keystore opened successfully, but the configured alias was not found. Compare KEY_ALIAS with the alias listed above."
            exit 1
          fi
          echo "Checking private-key password..."
          if ! keytool -certreq -alias "$KEY_ALIAS" -keystore "$STORE" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -file "$RUNNER_TEMP/mm4-key-validation.csr"; then
            echo "::error::The store and alias are valid, but the private key could not be unlocked. Check KEY_PASSWORD."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/mm4-key-validation.csr"
          echo "Private keystore, alias, and key password validated."
      - name: Run codec unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug and release APKs
        run: gradle --no-daemon assembleDebug assembleRelease
      - name: Verify APKs exist
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/release/app-release.apk
      - name: Verify release signing
        if: steps.signing.outputs.has_keystore == 'true'
        run: |
          jarsigner -verify -verbose -certs app/build/outputs/apk/release/app-release.apk
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mm4-save-data-editor-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: mm4-save-data-editor-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

# Trigger a fresh validation run after improving keystore diagnostics.
